<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATE DA 2027 — Prep Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F6F6F3;
  --paper:#FFFFFF;
  --line:#E2E2DC;
  --ink:#1B1E1D;
  --ink-2:#5B5F5C;
  --ink-3:#8B8F8B;
  --teal:#0E6E62;
  --teal-soft:#E4F0EE;
  --amber:#B4791A;
  --amber-soft:#FBF0DD;
  --rose:#AE3B45;
  --rose-soft:#F8E7E8;
  --slate:#8A8F92;
  --slate-soft:#EEEEEC;
  --radius:7px;
  --sans: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --paper:#1D2023; --line:#2C3033; --ink:#EDEEEC; --ink-2:#B0B4B1; --ink-3:#7D827F;
    --teal:#3FB6A5; --teal-soft:#173330; --amber:#E0A742; --amber-soft:#332A16;
    --rose:#E17984; --rose-soft:#361D20; --slate:#9AA0A3; --slate-soft:#25282B;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --paper:#1D2023; --line:#2C3033; --ink:#EDEEEC; --ink-2:#B0B4B1; --ink-3:#7D827F;
  --teal:#3FB6A5; --teal-soft:#173330; --amber:#E0A742; --amber-soft:#332A16;
  --rose:#E17984; --rose-soft:#361D20; --slate:#9AA0A3; --slate-soft:#25282B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
body{-webkit-font-smoothing:antialiased;}
.mono{font-family:var(--mono);}
a{color:inherit;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}

#shell{display:flex;min-height:100vh;}

/* ---- Sidebar ---- */
#sidebar{
  width:220px;flex:0 0 220px;background:var(--paper);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line);}
.brand .title{font-weight:800;font-size:15px;letter-spacing:0.2px;}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;}
nav.navlist{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1;}
nav.navlist button{
  text-align:left;background:none;border:none;padding:9px 10px;border-radius:6px;
  font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:9px;
}
nav.navlist button .dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:0 0 auto;}
nav.navlist button.active{background:var(--teal-soft);color:var(--teal);font-weight:600;}
nav.navlist button.active .dot{background:var(--teal);}
nav.navlist button:hover:not(.active){background:var(--slate-soft);}
.sidebar-foot{padding:12px 14px 16px;border-top:1px solid var(--line);}
.sidebar-foot .countdown-mini{font-family:var(--mono);font-size:12px;color:var(--ink-3);}
.sidebar-foot .countdown-mini b{color:var(--ink);font-size:14px;}

/* ---- Main ---- */
#main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1180px;}
.pagehead{margin-bottom:22px;}
.pagehead h1{font-size:21px;margin:0 0 4px;font-weight:800;}
.pagehead p{margin:0;color:var(--ink-2);font-size:13.5px;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.card + .card{margin-top:14px;}
.hairline{border-top:1px solid var(--line);}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} #main{padding:18px 14px 50px;} #shell{flex-direction:column;} #sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;} nav.navlist{flex-direction:row;} .brand,.sidebar-foot{display:none;}}

.stat{padding:14px 0;border-bottom:1px solid var(--line);}
.stat:last-child{border-bottom:none;}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);}
.statgrid .stat{border-right:1px solid var(--line);padding:14px 16px;border-bottom:none;}
.statgrid .stat:last-child{border-right:none;}
@media (max-width:900px){.statgrid{grid-template-columns:repeat(2,1fr);} .statgrid .stat:nth-child(2n){border-right:none;} .statgrid .stat{border-bottom:1px solid var(--line);}}
.stat .num{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1;}
.stat .lbl{font-size:12px;color:var(--ink-2);margin-top:6px;}

.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;}
.b-done{background:var(--teal-soft);color:var(--teal);}
.b-progress{background:var(--amber-soft);color:var(--amber);}
.b-notstarted{background:var(--slate-soft);color:var(--slate);}
.b-revision{background:var(--rose-soft);color:var(--rose);}

.progressbar{height:8px;border-radius:5px;background:var(--slate-soft);overflow:hidden;}
.progressbar > div{height:100%;background:var(--teal);}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);}
.btn:hover{background:var(--slate-soft);}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff;}
.btn-primary:hover{opacity:0.9;background:var(--teal);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;margin-top:10px;}
input.f,select.f,textarea.f{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:13.5px;}
textarea.f{resize:vertical;min-height:60px;}

table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th{text-align:left;font-size:11px;text-transform:none;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.tbl tr:last-child td{border-bottom:none;}
table.tbl tr:hover td{background:var(--slate-soft);}

.section-title{font-size:12px;font-weight:700;color:var(--ink-2);margin:0 0 10px;}
.hero{border-left:3px solid var(--teal);padding-left:16px;}

.topiclist{display:flex;flex-direction:column;}
.topicrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.topicrow:last-child{border-bottom:none;}
.topicrow .tname{flex:1;font-size:13.5px;}
.statuspick{display:flex;gap:4px;}
.statuspick button{border:1px solid var(--line);background:var(--paper);font-size:10.5px;padding:4px 7px;border-radius:5px;color:var(--ink-2);}
.statuspick button.on{border-color:transparent;}
.statuspick button.on.s-completed{background:var(--teal);color:#fff;}
.statuspick button.on.s-progress{background:var(--amber);color:#fff;}
.statuspick button.on.s-notstarted{background:var(--slate);color:#fff;}
.statuspick button.on.s-revision{background:var(--rose);color:#fff;}

.subjectcard{cursor:pointer;transition:border-color .12s;}
.subjectcard:hover{border-color:var(--teal);}
.subjectcard h3{margin:0 0 2px;font-size:15px;}
.subjectcard .meta{font-size:12px;color:var(--ink-3);margin-bottom:10px;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px;}
.modal{background:var(--paper);border-radius:10px;max-width:560px;width:100%;padding:22px;border:1px solid var(--line);}
.modal h2{margin:0 0 4px;font-size:17px;}
.modal .close{float:right;background:none;border:none;font-size:18px;color:var(--ink-3);}

.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;background:var(--slate-soft);color:var(--ink-2);margin-right:5px;}
.phase-p1{color:#3B6FB6;} .phase-p2{color:var(--amber);} .phase-p3{color:#7A57B0;} .phase-p4{color:var(--rose);}
.chip-phase{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;}
.chip-p1{background:#E7EEF9;color:#3B6FB6;} .chip-p2{background:var(--amber-soft);color:var(--amber);}
.chip-p3{background:#EFE9F7;color:#7A57B0;} .chip-p4{background:var(--rose-soft);color:var(--rose);}

.empty{color:var(--ink-3);font-size:13px;padding:16px 0;text-align:center;}

.heatmap{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;}
.heat-cell{aspect-ratio:1;border-radius:2px;background:var(--slate-soft);}

.timeline{position:relative;height:54px;margin:18px 0 6px;}
.timeline .track{position:absolute;top:24px;left:0;right:0;height:6px;background:var(--slate-soft);border-radius:4px;overflow:hidden;display:flex;}
.timeline .seg{height:100%;}
.timeline .marker{position:absolute;top:14px;width:2px;height:26px;background:var(--ink);}
.timeline .marker-lbl{position:absolute;top:34px;font-size:10px;font-family:var(--mono);color:var(--ink-2);white-space:nowrap;transform:translateX(-50%);}

.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}

.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.filterbar select, .filterbar input{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:12.5px;color:var(--ink);}

.small{font-size:12px;color:var(--ink-2);}
.mb0{margin-bottom:0;}
.flexrow{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mt10{margin-top:10px;} .mt14{margin-top:14px;} .mt20{margin-top:20px;}
canvas{max-width:100%;}
</style>
</head>
<body>
<div id="shell">
  <div id="sidebar">
    <div class="brand">
      <div class="title">GATE DA 2027</div>
      <div class="sub" id="brandSub">— days remaining —</div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="sidebar-foot">
      <div class="countdown-mini">Overall <b id="footPct">0%</b></div>
    </div>
  </div>
  <div id="main"></div>
</div>
<div id="modalRoot"></div>
<script>
/* ============================= SYLLABUS ============================= */
const SYLLABUS_RAW = [
  { id:'ps', name:'Probability and Statistics', weight:1.15, topics:[
    'Counting (permutations and combinations)','Probability axioms','Sample space and events',
    'Independent events','Mutually exclusive events','Marginal, conditional and joint probability',
    'Bayes theorem','Conditional expectation and variance','Mean, median, mode and standard deviation',
    'Correlation and covariance','Random variables','Discrete random variables and probability mass functions',
    'Uniform, Bernoulli, binomial distributions','Continuous random variables and probability distribution function',
    'Uniform, exponential, Poisson, normal, standard normal distributions','t-distribution and chi-squared distribution',
    'Cumulative distribution function (CDF)','Conditional PDF','Central Limit Theorem','Confidence interval',
    'z-test','t-test','Chi-squared test'
  ]},
  { id:'la', name:'Linear Algebra', weight:1.05, topics:[
    'Vector space','Subspaces','Linear dependence and independence of vectors','Matrices','Projection matrix',
    'Orthogonal matrix','Idempotent matrix','Partition matrix and their properties','Quadratic forms',
    'Systems of linear equations and solutions','Gaussian elimination','Eigenvalues and eigenvectors',
    'Determinant','Rank','Nullity','Projections','LU decomposition','Singular value decomposition (SVD)'
  ]},
  { id:'co', name:'Calculus and Optimization', weight:0.85, topics:[
    'Functions of a single variable','Limit, continuity and differentiability','Taylor series',
    'Maxima and minima','Optimization involving a single variable'
  ]},
  { id:'pdsa', name:'Programming, Data Structures and Algorithms', weight:1.0, topics:[
    'Programming in Python','Stacks','Queues','Linked lists','Trees','Hash tables','Linear search',
    'Binary search','Selection sort','Bubble sort','Insertion sort','Merge sort (divide and conquer)',
    'Quick sort (divide and conquer)','Introduction to graph theory','Graph traversals','Shortest path algorithms'
  ]},
  { id:'dbmw', name:'Database Management and Warehousing', weight:0.9, topics:[
    'ER-model','Relational algebra','Tuple calculus','SQL','Integrity constraints','Normal form',
    'File organization','Indexing','Data types','Normalization (data transformation)','Discretization',
    'Sampling','Compression','Data warehouse modelling & multidimensional schema','Concept hierarchies',
    'Measures: categorization and computation'
  ]},
  { id:'ml', name:'Machine Learning', weight:1.3, topics:[
    'Regression and classification problems','Simple linear regression','Multiple linear regression',
    'Ridge regression','Logistic regression','K-nearest neighbour','Naive Bayes classifier',
    'Linear discriminant analysis','Support vector machine','Decision trees','Bias-variance trade-off',
    'Leave-one-out (LOO) cross-validation','K-folds cross-validation','Multi-layer perceptron',
    'Feed-forward neural network','Clustering algorithms','K-means / K-medoid',
    'Hierarchical clustering (top-down, bottom-up)','Single-linkage and multiple-linkage',
    'Dimensionality reduction','Principal component analysis (PCA)'
  ]},
  { id:'ai', name:'Artificial Intelligence', weight:1.0, topics:[
    'Informed search','Uninformed search','Adversarial search','Propositional logic','Predicate logic',
    'Conditional independence representation','Exact inference through variable elimination',
    'Approximate inference through sampling'
  ]},
];
const SYLLABUS = SYLLABUS_RAW.map(sec => ({
  ...sec,
  topics: sec.topics.map((t,i) => ({ id: sec.id+'-'+(i+1), name:t }))
}));
const ALL_TOPICS = SYLLABUS.flatMap(s => s.topics.map(t => ({...t, sectionId:s.id, sectionName:s.name})));
const TOPIC_BY_ID = Object.fromEntries(ALL_TOPICS.map(t => [t.id, t]));
const SECTION_BY_ID = Object.fromEntries(SYLLABUS.map(s => [s.id, s]));

/* ============================= DATES ============================= */
const PREP_START = '2026-09-17';
const PREP_END = '2027-02-01';
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtD(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function humanDate(s){ const d=parseD(s); return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); }
function dayName(s){ return parseD(s).toLocaleDateString('en-US',{weekday:'long'}); }
function todayStr(){
  const real = fmtD(new Date());
  if(real < PREP_START) return PREP_START;
  if(real > PREP_END) return PREP_END;
  return real;
}
const START_D = parseD(PREP_START), END_D = parseD(PREP_END);
const ALL_DATES = (function(){ const arr=[]; let c=new Date(START_D); while(c<=END_D){ arr.push(fmtD(c)); c=addDays(c,1);} return arr; })();
const TOTAL_DAYS = ALL_DATES.length;
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }

/* ============================= PLANNER GENERATION ============================= */
// Phase boundaries (index into ALL_DATES)
const P1_END_IDX = Math.floor(TOTAL_DAYS*0.60)-1;   // Concept Building
const P2_END_IDX = Math.floor(TOTAL_DAYS*0.79)-1;   // Topic-wise Problem Solving
const P3_END_IDX = Math.floor(TOTAL_DAYS*0.90)-1;   // Revision
// remaining -> Phase 4: Mock Tests + Final Revision

function phaseForIdx(i){
  if(i<=P1_END_IDX) return 'P1';
  if(i<=P2_END_IDX) return 'P2';
  if(i<=P3_END_IDX) return 'P3';
  return 'P4';
}
const PHASE_LABEL = {P1:'Concept Building',P2:'Topic-wise Problem Solving',P3:'Revision',P4:'Mock Tests + Final Revision'};

function allocateDaysBySection(totalDaysForPhase){
  const totalTopics = ALL_TOPICS.length;
  let alloc = SYLLABUS.map(s => Math.max(1, Math.round(totalDaysForPhase * s.topics.length / totalTopics)));
  let diff = totalDaysForPhase - alloc.reduce((a,b)=>a+b,0);
  let idx = 0;
  while(diff !== 0){
    const i = idx % alloc.length;
    if(diff>0){ alloc[i]++; diff--; } else if(alloc[i]>1){ alloc[i]--; diff++; }
    idx++;
    if(idx>10000) break;
  }
  return alloc; // parallel to SYLLABUS array
}

function buildStudyBlocks(dayCount, mode){
  // mode: 'learn' (phase1, 1 topic focus per day, buffer=consolidation) or 'practice' (phase2, problem solving)
  const alloc = allocateDaysBySection(dayCount);
  const blocks = []; // {sectionId, sectionName, topicIds, topicNames, isBuffer}
  SYLLABUS.forEach((sec, si) => {
    const days = alloc[si];
    const topics = sec.topics;
    if(days >= topics.length){
      topics.forEach(t => blocks.push({sectionId:sec.id, sectionName:sec.name, topicIds:[t.id], topicNames:[t.name], weight:sec.weight, buffer:false}));
      const bufferDays = days - topics.length;
      for(let b=0;b<bufferDays;b++){
        blocks.push({sectionId:sec.id, sectionName:sec.name, topicIds:[], topicNames:[], weight:sec.weight, buffer:true});
      }
    } else {
      const perDay = Math.ceil(topics.length / days);
      for(let d=0; d<days; d++){
        const chunk = topics.slice(d*perDay, (d+1)*perDay);
        if(chunk.length===0) continue;
        blocks.push({sectionId:sec.id, sectionName:sec.name, topicIds:chunk.map(t=>t.id), topicNames:chunk.map(t=>t.name), weight:sec.weight, buffer:false});
      }
    }
  });
  return blocks;
}

let GENERATED_PLAN = null; // dateStr -> plan object (base, before user overrides)
function generatePlan(){
  const plan = {};
  const p1Days = P1_END_IDX+1;
  const p2Days = P2_END_IDX-P1_END_IDX;
  const p3Days = P3_END_IDX-P2_END_IDX;
  const p4Days = TOTAL_DAYS-1-P3_END_IDX;

  const p1Blocks = buildStudyBlocks(p1Days,'learn');
  const p2Blocks = buildStudyBlocks(p2Days,'practice');
  const p3Blocks = buildStudyBlocks(p3Days,'revise');

  ALL_DATES.forEach((date, idx) => {
    const phase = phaseForIdx(idx);
    let block, label, hours, qTarget, priority;
    if(phase==='P1'){
      block = p1Blocks[idx] || p1Blocks[p1Blocks.length-1];
      const base = 1.6*(block.weight||1);
      hours = block.buffer ? Math.round((base*1.3)*10)/10 : Math.round((base*(0.7+0.3*block.topicIds.length))*10)/10;
      qTarget = block.buffer ? 20 : 10*block.topicIds.length;
      label = block.buffer ? `Practice & Consolidation — ${block.sectionName}` : `Concept Building — ${block.sectionName}`;
      priority = 'High';
    } else if(phase==='P2'){
      const rel = idx-(P1_END_IDX+1);
      block = p2Blocks[rel] || p2Blocks[p2Blocks.length-1];
      const base = 1.8*(block.weight||1);
      hours = Math.round((base*(0.7+0.3*Math.max(1,block.topicIds.length)))*10)/10;
      qTarget = block.buffer ? 25 : 18*Math.max(1,block.topicIds.length);
      label = block.buffer ? `Extra Practice — ${block.sectionName}` : `Problem Solving — ${block.sectionName}`;
      priority = 'Medium';
    } else if(phase==='P3'){
      const rel = idx-(P2_END_IDX+1);
      block = p3Blocks[rel] || p3Blocks[p3Blocks.length-1];
      hours = 2.0;
      qTarget = 20;
      label = `Revision — ${block.sectionName}`;
      priority = 'Medium';
    } else {
      const rel = idx-(P3_END_IDX+1);
      const cyclePos = rel % 3;
      const secIdx = Math.floor(rel/1) % SYLLABUS.length;
      if(cyclePos===2){
        block = {sectionId:null, sectionName:'Full Syllabus', topicIds:[], topicNames:[]};
        label = 'Mock Test Day';
        hours = 3.0; qTarget = 65; priority = 'High';
      } else {
        const sec = SYLLABUS[secIdx];
        block = {sectionId:sec.id, sectionName:sec.name, topicIds:sec.topics.map(t=>t.id), topicNames:[]};
        label = `Final Revision — ${sec.name}`;
        hours = 2.5; qTarget = 25; priority = 'High';
      }
      if(idx===TOTAL_DAYS-1){ label='Final Light Revision & Rest'; hours=1.5; qTarget=10; priority='Low'; }
    }
    plan[date] = {
      date, phase, phaseLabel:PHASE_LABEL[phase], label,
      sectionId: block.sectionId, sectionName: block.sectionName,
      topicIds: block.topicIds||[], topicNames: block.topicNames||[],
      plannedHours: hours, questionsTarget: qTarget, priority
    };
  });
  return plan;
}

/* ============================= STORE ============================= */
const STORE_KEY = 'gateDa2027DashboardV1';
function defaultState(){
  const topics = {};
  ALL_TOPICS.forEach(t => { topics[t.id] = { status:'not_started', dateStarted:null, dateCompleted:null, notes:'', confidence:0,
    revisions:{r1:{done:false,date:null},r2:{done:false,date:null},r3:{done:false,date:null},final:{done:false,date:null}} }; });
  return {
    version:1,
    topics,
    sessions: [], // {id,date,sectionId,topicId,startTime,endTime,hours,attempted,correct,confidence,notes,difficulty,source}
    mockTests: [], // {id,date,name,totalMarks,marksObtained,attempted,correct,incorrect,unattempted,timeTaken,weakSubjects,notes}
    mistakes: [], // {id,date,sectionId,topicId,question,mistake,correctApproach,reason,revisionStatus}
    dailyReflections: {}, // dateStr -> {learned,struggled,mistakes,tomorrowTarget}
    plannerOverrides: {}, // dateStr -> partial plan override
    goals: { dailyHours:3, weeklyHours:18, dailyQuestions:30, weeklyQuestions:180, targetMocks:20 },
    lastActiveDate: null,
    theme: 'auto'
  };
}
let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const def = defaultState();
    // shallow-merge safety for forward compatibility
    return {...def, ...parsed, topics:{...def.topics, ...(parsed.topics||{})}, goals:{...def.goals,...(parsed.goals||{})}};
  }catch(e){ console.error('load failed', e); return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }catch(e){ console.error('save failed', e); }
}
function resetAllData(){
  STATE = defaultState();
  saveState();
  render();
}

/* ============================= DERIVED / COMPUTED ============================= */
function getPlanForDate(date){
  const base = GENERATED_PLAN[date];
  const ov = STATE.plannerOverrides[date];
  return ov ? {...base, ...ov} : base;
}
function sessionsForTopic(topicId){ return STATE.sessions.filter(s=>s.topicId===topicId); }
function sessionsForSection(sectionId){ return STATE.sessions.filter(s=>s.sectionId===sectionId); }
function topicAgg(topicId){
  const sess = sessionsForTopic(topicId);
  const hours = sess.reduce((a,s)=>a+(Number(s.hours)||0),0);
  const attempted = sess.reduce((a,s)=>a+(Number(s.attempted)||0),0);
  const correct = sess.reduce((a,s)=>a+(Number(s.correct)||0),0);
  const accuracy = attempted>0 ? Math.round((correct/attempted)*1000)/10 : null;
  const lastDate = sess.length ? sess.map(s=>s.date).sort().slice(-1)[0] : null;
  return {hours:Math.round(hours*10)/10, attempted, correct, accuracy, lastDate, sessionCount:sess.length};
}
function sectionAgg(sectionId){
  const sec = SECTION_BY_ID[sectionId];
  const topics = sec.topics;
  let completed=0, inProgress=0, notStarted=0, revisionNeeded=0;
  topics.forEach(t=>{
    const st = STATE.topics[t.id].status;
    if(st==='completed') completed++; else if(st==='in_progress') inProgress++;
    else if(st==='revision_needed') revisionNeeded++; else notStarted++;
  });
  const sess = sessionsForSection(sectionId);
  const hours = sess.reduce((a,s)=>a+(Number(s.hours)||0),0);
  const attempted = sess.reduce((a,s)=>a+(Number(s.attempted)||0),0);
  const correct = sess.reduce((a,s)=>a+(Number(s.correct)||0),0);
  const accuracy = attempted>0 ? Math.round((correct/attempted)*1000)/10 : null;
  const lastDate = sess.length ? sess.map(s=>s.date).sort().slice(-1)[0] : null;
  const pct = Math.round((completed/topics.length)*1000)/10;
  return {total:topics.length, completed, inProgress, notStarted, revisionNeeded, pct, hours:Math.round(hours*10)/10, attempted, correct, accuracy, lastDate};
}
function overallStats(){
  const total = ALL_TOPICS.length;
  let completed=0, inProgress=0, notStarted=0, revisionNeeded=0;
  ALL_TOPICS.forEach(t=>{
    const st = STATE.topics[t.id].status;
    if(st==='completed') completed++; else if(st==='in_progress') inProgress++;
    else if(st==='revision_needed') revisionNeeded++; else notStarted++;
  });
  const totalHours = STATE.sessions.reduce((a,s)=>a+(Number(s.hours)||0),0);
  const totalAttempted = STATE.sessions.reduce((a,s)=>a+(Number(s.attempted)||0),0);
  const totalCorrect = STATE.sessions.reduce((a,s)=>a+(Number(s.correct)||0),0);
  const accuracy = totalAttempted>0 ? Math.round((totalCorrect/totalAttempted)*1000)/10 : 0;
  const mockCount = STATE.mockTests.length;
  const avgMock = mockCount>0 ? Math.round((STATE.mockTests.reduce((a,m)=>a+(m.totalMarks>0?(m.marksObtained/m.totalMarks*100):0),0)/mockCount)*10)/10 : 0;
  return { total, completed, inProgress, notStarted, revisionNeeded,
    pct: Math.round((completed/total)*1000)/10,
    totalHours: Math.round(totalHours*10)/10, totalAttempted, totalCorrect, accuracy, mockCount, avgMock };
}
function activeDatesSet(){ return new Set(STATE.sessions.map(s=>s.date)); }
function currentStreak(){
  const active = activeDatesSet();
  let d = parseD(todayStr());
  let streak = 0;
  // if today has no activity yet, start checking from yesterday so a same-day-not-yet-logged doesn't zero the streak
  if(!active.has(fmtD(d))) d = addDays(d,-1);
  while(active.has(fmtD(d)) && fmtD(d)>=PREP_START){
    streak++; d = addDays(d,-1);
  }
  return streak;
}
function todaysSessions(date){ return STATE.sessions.filter(s=>s.date===date); }
function todaysAgg(date){
  const sess = todaysSessions(date);
  const hours = sess.reduce((a,s)=>a+(Number(s.hours)||0),0);
  const attempted = sess.reduce((a,s)=>a+(Number(s.attempted)||0),0);
  const topicsTouched = new Set(sess.map(s=>s.topicId).filter(Boolean));
  return {hours:Math.round(hours*10)/10, attempted, topicsTouched: topicsTouched.size, sessCount: sess.length};
}
function weeklyHours(){
  const map = {};
  ALL_DATES.forEach(d=>map[d]=0);
  STATE.sessions.forEach(s=>{ if(map[s.date]!==undefined) map[s.date]+= (Number(s.hours)||0); });
  return map;
}
function revisionDueToday(){
  const t = todayStr();
  const due = [];
  ALL_TOPICS.forEach(topic=>{
    const rec = STATE.topics[topic.id];
    if(rec.status!=='completed' && rec.status!=='revision_needed') return;
    const stages = ['r1','r2','r3','final'];
    for(const st of stages){
      const s = rec.revisions[st];
      if(!s.done && s.date && s.date<=t){ due.push({topic, stage:st, date:s.date}); break; }
    }
  });
  return due;
}
function scheduleRevisions(topicId, completionDate){
  const rec = STATE.topics[topicId];
  const base = parseD(completionDate);
  rec.revisions.r1.date = fmtD(addDays(base,3));
  rec.revisions.r2.date = fmtD(addDays(base,7));
  rec.revisions.r3.date = fmtD(addDays(base,16));
  rec.revisions.final.date = fmtD(addDays(base,30));
}
function focusAreas(limit=8){
  const scored = ALL_TOPICS.map(t=>{
    const agg = topicAgg(t.id);
    const rec = STATE.topics[t.id];
    const mistakeCount = STATE.mistakes.filter(m=>m.topicId===t.id).length;
    let score = 0;
    if(agg.accuracy!==null) score += (100-agg.accuracy)*0.45; else if(rec.status!=='not_started') score += 20;
    score += (5-(rec.confidence||0))*8;
    score += Math.min(mistakeCount,5)*7;
    if(rec.status==='revision_needed') score += 25;
    const overdue = Object.values(rec.revisions).some(r=>!r.done && r.date && r.date<todayStr());
    if(overdue) score += 15;
    return { topic:t, score:Math.round(score*10)/10, accuracy:agg.accuracy, confidence:rec.confidence, mistakeCount, status:rec.status };
  }).filter(x=>x.status!=='not_started' || x.mistakeCount>0);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit);
}
function strongTopics(limit=8){
  const scored = ALL_TOPICS.map(t=>{
    const agg = topicAgg(t.id);
    const rec = STATE.topics[t.id];
    if(rec.status!=='completed' || agg.accuracy===null) return null;
    const score = agg.accuracy + (rec.confidence||0)*4;
    return {topic:t, score:Math.round(score*10)/10, accuracy:agg.accuracy, confidence:rec.confidence};
  }).filter(Boolean);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit);
}
function recentActivity(limit=10){
  const items = [];
  STATE.sessions.forEach(s=>items.push({type:'session',date:s.date,text:`Studied ${s.hours||0}h — ${TOPIC_BY_ID[s.topicId]?TOPIC_BY_ID[s.topicId].name:(s.sectionName||'General')}${s.attempted?` · ${s.correct||0}/${s.attempted} correct`:''}`}));
  STATE.mockTests.forEach(m=>items.push({type:'mock',date:m.date,text:`Mock test "${m.name}" — ${m.marksObtained}/${m.totalMarks}`}));
  Object.entries(STATE.topics).forEach(([id,rec])=>{ if(rec.dateCompleted) items.push({type:'complete',date:rec.dateCompleted,text:`Completed — ${TOPIC_BY_ID[id].name}`}); });
  items.sort((a,b)=> a.date<b.date?1:-1);
  return items.slice(0,limit);
}

function renderSessionsTable(sessions){
  if(!sessions.length) return `<div class="empty">No sessions logged yet.</div>`;
  return `<table class="tbl"><thead><tr><th>Time</th><th>Topic</th><th>Hours</th><th>Q's</th><th>Correct</th><th>Accuracy</th><th>Conf.</th></tr></thead><tbody>
    ${sessions.map(s=>{
      const acc = s.attempted>0 ? Math.round((s.correct/s.attempted)*1000)/10+'%' : '—';
      return `<tr><td class="mono">${esc(s.startTime||'')}${s.endTime?'–'+esc(s.endTime):''}</td><td>${TOPIC_BY_ID[s.topicId]?esc(TOPIC_BY_ID[s.topicId].name):esc(s.sectionName||'—')}</td><td class="mono">${s.hours||0}</td><td class="mono">${s.attempted||0}</td><td class="mono">${s.correct||0}</td><td class="mono">${acc}</td><td class="mono">${s.confidence||'—'}</td></tr>`;
    }).join('')}
  </tbody></table>`;
}

function setTopicStatus(topicId, status){
  const rec = STATE.topics[topicId];
  const prev = rec.status;
  rec.status = status;
  const today = todayStr();
  if(status==='in_progress' && !rec.dateStarted) rec.dateStarted = today;
  if(status==='completed'){
    rec.dateCompleted = today;
    if(!rec.dateStarted) rec.dateStarted = today;
    scheduleRevisions(topicId, today);
  }
  if(status!=='completed' && prev==='completed'){
    // unmarking completion clears the auto revision schedule so it doesn't linger
  }
  saveState();
}

function moveUnfinishedToTomorrow(date, plan){
  const remainingTopics = plan.topicIds.filter(tid => STATE.topics[tid].status!=='completed');
  if(remainingTopics.length===0){ toast('Nothing unfinished — nice work.'); return; }
  const tomorrow = fmtD(addDays(parseD(date),1));
  if(!ALL_DATES.includes(tomorrow)){ toast('Already at the end of the prep calendar.'); return; }
  const tomorrowBase = getPlanForDate(tomorrow);
  const mergedIds = Array.from(new Set([...remainingTopics, ...tomorrowBase.topicIds]));
  const mergedNames = mergedIds.map(id=>TOPIC_BY_ID[id]?TOPIC_BY_ID[id].name:id);
  STATE.plannerOverrides[tomorrow] = {
    ...tomorrowBase,
    topicIds: mergedIds, topicNames: mergedNames,
    label: (tomorrowBase.label||'') + ' + carried over topics',
    plannedHours: Math.round((tomorrowBase.plannedHours + remainingTopics.length*1.2)*10)/10,
    questionsTarget: tomorrowBase.questionsTarget + remainingTopics.length*10
  };
  // Shrink today's own remaining requirement so it isn't double counted going forward, but keep original plan visible via override with note only if today
  saveState();
  toast(`Moved ${remainingTopics.length} unfinished topic(s) to tomorrow.`);
  render();
}

function toast(msg){
  let el = document.getElementById('toastEl');
  if(!el){ el = document.createElement('div'); el.id='toastEl';
    el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:100;opacity:0;transition:opacity .2s;';
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.opacity='1';
  clearTimeout(el._t); el._t = setTimeout(()=>{el.style.opacity='0';},1800);
}

function buildOverviewCharts(){
  destroyCharts();
  const wh = weeklyHours();
  // aggregate into weeks (7-day buckets) from PREP_START
  const weeks = [];
  for(let i=0;i<ALL_DATES.length;i+=7){
    const chunk = ALL_DATES.slice(i,i+7);
    const hrs = chunk.reduce((a,d)=>a+(wh[d]||0),0);
    const qs = chunk.reduce((a,d)=>a+STATE.sessions.filter(s=>s.date===d).reduce((x,s)=>x+(Number(s.attempted)||0),0),0);
    weeks.push({label:'W'+(weeks.length+1), hrs:Math.round(hrs*10)/10, qs});
  }
  const doneWeeks = weeks.filter((w,i)=> ALL_DATES[i*7] <= todayStr());
  const last8 = doneWeeks.slice(-8).length ? doneWeeks.slice(-8) : weeks.slice(0,1);

  chartRefs.wh = new Chart(document.getElementById('weeklyHoursChart'), {
    type:'bar',
    data:{ labels:last8.map(w=>w.label), datasets:[{label:'Hours', data:last8.map(w=>w.hrs), backgroundColor:'#0E6E62'}] },
    options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
  });
  chartRefs.wq = new Chart(document.getElementById('weeklyQChart'), {
    type:'bar',
    data:{ labels:last8.map(w=>w.label), datasets:[{label:'Questions', data:last8.map(w=>w.qs), backgroundColor:'#B4791A'}] },
    options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
  });

  // accuracy trend by date with activity
  const activeDates = Array.from(new Set(STATE.sessions.map(s=>s.date))).sort();
  const accSeries = activeDates.map(d=>{
    const sess = STATE.sessions.filter(s=>s.date===d);
    const att = sess.reduce((a,s)=>a+(Number(s.attempted)||0),0);
    const cor = sess.reduce((a,s)=>a+(Number(s.correct)||0),0);
    return att>0 ? Math.round((cor/att)*1000)/10 : null;
  });
  chartRefs.acc = new Chart(document.getElementById('accChart'), {
    type:'line',
    data:{ labels:activeDates.map(d=>d.slice(5)), datasets:[{label:'Accuracy %', data:accSeries, borderColor:'#0E6E62', tension:0.25, spanGaps:true}] },
    options:{plugins:{legend:{display:false}}, scales:{y:{min:0,max:100}}}
  });

  const mocks = [...STATE.mockTests].sort((a,b)=>a.date<b.date?-1:1);
  chartRefs.mock = new Chart(document.getElementById('mockChart'), {
    type:'line',
    data:{ labels:mocks.map(m=>m.date.slice(5)), datasets:[{label:'Score %', data:mocks.map(m=>m.totalMarks>0?Math.round(m.marksObtained/m.totalMarks*1000)/10:0), borderColor:'#AE3B45', tension:0.25}] },
    options:{plugins:{legend:{display:false}}, scales:{y:{min:0,max:100}}}
  });
}

function renderHeatmap(){
  const wh = weeklyHours();
  const max = Math.max(1, ...Object.values(wh));
  const wrap = document.getElementById('heatmapWrap');
  if(!wrap) return;
  wrap.innerHTML = `<div class="heatmap">${ALL_DATES.map(d=>{
    const v = wh[d]||0;
    const intensity = v<=0 ? 0 : Math.min(4, Math.ceil((v/max)*4));
    const colors = ['var(--slate-soft)','#CDE7E2','#8FCFC2','#3FA593','var(--teal)'];
    const future = d>todayStr();
    return `<div class="heat-cell" title="${d}: ${v.toFixed(1)}h" style="background:${future?'var(--slate-soft)':colors[intensity]};opacity:${future?0.4:1};"></div>`;
  }).join('')}</div>
  <div class="small mt10">Each cell = one day of the prep window (${humanDate(PREP_START)} → ${humanDate(PREP_END)}). Darker = more hours studied.</div>`;
}

function renderRevision(){

  ALL_TOPICS.forEach(t=>{

      if(!r.done && r.date && r.date>todayStr()) upcoming.push({topic:t, stage:k, date:r.date});
    });
  });
  upcoming.sort((a,b)=>a.date<b.date?-1:1);

  document.getElementById('main').innerHTML = `
    <div class="pagehead"><h1>Revision Tracker</h1><p>Spaced revision stages, auto-scheduled 3 / 7 / 16 / 30 days after a topic is marked completed.</p></div>
    <div class="card">
      <div class="section-title">TOPICS TO REVISE TODAY</div>
      ${due.length ? `<div class="topiclist">${due.map(d=>`<div class="topicrow">
        <div class="tname">${esc(d.topic.name)} <span class="tag">${esc(d.topic.sectionName)}</span></div>
        <span class="tag">${({r1:'Revision 1',r2:'Revision 2',r3:'Revision 3',final:'Final'})[d.stage]}</span>

      </div>`).join('')}</div>` : `<div class="empty">Nothing due today.</div>`}
    </div>

      <div class="section-title">UPCOMING REVISIONS</div>
      ${upcoming.length? `<table class="tbl"><thead><tr><th>Date</th><th>Topic</th><th>Stage</th></tr></thead><tbody>
        ${upcoming.slice(0,30).map(u=>`<tr><td class="mono">${humanDate(u.date)}</td><td>${esc(u.topic.name)}</td><td>${({r1:'Revision 1',r2:'Revision 2',r3:'Revision 3',final:'Final'})[u.stage]}</td></tr>`).join('')}

/* ============================= PAGE: PRACTICE LOG ============================= */
function renderPractice(){
  let filterSec = ROUTE.filterSec || '';
  const rows = STATE.sessions.filter(s=>!filterSec || s.sectionId===filterSec).filter(s=>s.attempted>0)
    .sort((a,b)=>a.date<b.date?1:-1);
  document.getElementById('main').innerHTML = `
    <div class="pagehead flexrow">
      <div><h1>Practice Log</h1><p>Every logged practice session with attempted/correct counts.</p></div>
      <button class="btn btn-primary" id="addPracticeBtn">+ Add Entry</button>
    </div>
    <div class="filterbar">
      <select id="secFilter"><option value="">All subjects</option>${SYLLABUS.map(s=>`<option value="${s.id}" ${filterSec===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    </div>
    <div class="card">
      ${rows.length? `<table class="tbl"><thead><tr><th>Date</th><th>Subject</th><th>Topic</th><th>Attempted</th><th>Correct</th><th>Incorrect</th><th>Accuracy</th><th>Difficulty</th><th>Source</th></tr></thead><tbody>
      ${rows.map(s=>{
        const acc = s.attempted>0?Math.round((s.correct/s.attempted)*1000)/10:0;
        return `<tr><td class="mono">${humanDate(s.date)}</td><td>${esc(s.sectionName||'—')}</td><td>${TOPIC_BY_ID[s.topicId]?esc(TOPIC_BY_ID[s.topicId].name):'—'}</td><td class="mono">${s.attempted}</td><td class="mono">${s.correct}</td><td class="mono">${s.attempted-s.correct}</td><td class="mono">${acc}%</td><td>${esc(s.difficulty||'—')}</td><td>${esc(s.source||'—')}</td></tr>`;
      }).join('')}</tbody></table>` : `<div class="empty">No practice entries yet.</div>`}
    </div>
  `;
  document.getElementById('secFilter').onchange = e=>navigate('practice',{filterSec:e.target.value});
  document.getElementById('addPracticeBtn').onclick = ()=>openPracticeModal();
}

function openPracticeModal(){

          <div><label class="f">Daily study-hour goal</label><input class="f" type="number" step="0.5" name="dailyHours" value="${g.dailyHours}"></div>
          <div><label class="f">Weekly study-hour goal</label><input class="f" type="number" step="0.5" name="weeklyHours" value="${g.weeklyHours}"></div>
          <div><label class="f">Daily question goal</label><input class="f" type="number" name="dailyQuestions" value="${g.dailyQuestions}"></div>
          <div><label class="f">Weekly question goal</label><input class="f" type="number" name="weeklyQuestions" value="${g.weeklyQuestions}"></div>
          <div><label class="f">Target number of mock tests</label><input class="f" type="number" name="targetMocks" value="${g.targetMocks}"></div>
        </div>
        <div class="btn-row mt14"><button class="btn btn-primary" type="submit">Save Goals</button></div>
      </form>
    </div>
    <div class="card mt14">
      <div class="section-title">PLANNED VS ACTUAL</div>
      <div class="grid grid-2">
        <div class="stat"><div class="flexrow"><span class="small">This week — hours</span><span class="mono">${thisWeekHours()} / ${g.weeklyHours}</span></div>${progressBar(thisWeekHours()/g.weeklyHours*100)}</div>
        <div class="stat"><div class="flexrow"><span class="small">This week — questions</span><span class="mono">${thisWeekQuestions()} / ${g.weeklyQuestions}</span></div>${progressBar(thisWeekQuestions()/g.weeklyQuestions*100)}</div>
      </div>
    </div>
    <div class="card mt14">
      <div class="section-title">APPEARANCE</div>
      <div class="btn-row">
        <button class="btn ${STATE.theme==='light'?'btn-primary':''}" id="themeLight">Light</button>
        <button class="btn ${STATE.theme==='dark'?'btn-primary':''}" id="themeDark">Dark</button>
        <button class="btn ${STATE.theme==='auto'?'btn-primary':''}" id="themeAuto">Auto</button>
      </div>
    </div>
    <div class="card mt14">
      <div class="section-title">DATA</div>
      <p class="small">All your progress is stored locally in this browser. Nothing is sent anywhere.</p>
      <div class="btn-row">
        <button class="btn" id="exportBtn">Export data (JSON)</button>
        <button class="btn" id="resetBtn" style="color:var(--rose);border-color:var(--rose);">Reset all progress to zero</button>
      </div>
    </div>
  `;
  document.getElementById('goalsForm').addEventListener('submit', e=>{
    e.preventDefault(); const fd = new FormData(e.target);
    STATE.goals = { dailyHours:Number(fd.get('dailyHours'))||g.dailyHours, weeklyHours:Number(fd.get('weeklyHours'))||g.weeklyHours,
      dailyQuestions:Number(fd.get('dailyQuestions'))||g.dailyQuestions, weeklyQuestions:Number(fd.get('weeklyQuestions'))||g.weeklyQuestions,
      targetMocks:Number(fd.get('targetMocks'))||g.targetMocks };
    saveState(); toast('Goals saved'); render();
  });
  document.getElementById('themeLight').onclick = ()=>setTheme('light');
  document.getElementById('themeDark').onclick = ()=>setTheme('dark');
  document.getElementById('themeAuto').onclick = ()=>setTheme('auto');
  document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='gate-da-2027-progress.json'; a.click();
  };
  document.getElementById('resetBtn').onclick = ()=>{
    if(confirm('This will permanently erase all logged progress and start fresh at 0%. Continue?')) resetAllData();
  };
}
function setTheme(t){ STATE.theme = t; saveState(); applyTheme(); render(); }
function applyTheme(){ document.documentElement.setAttribute('data-theme', STATE.theme==='auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : STATE.theme); if(STATE.theme==='auto') document.documentElement.removeAttribute('data-theme'); }
function thisWeekHours(){
  const t = parseD(todayStr()); const startOfWeek = addDays(t, -t.getDay());
  return Math.round(STATE.sessions.filter(s=>parseD(s.date)>=startOfWeek && parseD(s.date)<=t).reduce((a,s)=>a+(Number(s.hours)||0),0)*10)/10;
}
function thisWeekQuestions(){
  const t = parseD(todayStr()); const startOfWeek = addDays(t, -t.getDay());
  return STATE.sessions.filter(s=>parseD(s.date)>=startOfWeek && parseD(s.date)<=t).reduce((a,s)=>a+(Number(s.attempted)||0),0);
}

  renderNav();

  const map = { today:renderToday, overview:renderOverview, subjects:renderSubjects, planner:renderPlanner,

    focus:renderFocus, goals:renderGoals };
  (map[ROUTE.page] || renderToday)();
}

  // Only seeds if there is truly zero activity anywhere - a lightweight illustrative demo, easily reset.
}

GENERATED_PLAN = generatePlan();
applyTheme();
render();
